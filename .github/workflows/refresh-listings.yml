name: refresh-listings

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-listings
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Discover buildings
        run: |
          node --input-type=module -e "
            import { loadBuildings } from './scrape/buildings.js';
            import { readFileSync } from 'node:fs';
            const known = new Set(loadBuildings().filter((b) => b.url).map((b) => b.n));
            let have = new Set();
            try { have = new Set(JSON.parse(readFileSync('data/sources.json', 'utf8')).buildings.map((b) => b.name)); } catch {}
            const missing = [...known].filter((n) => !have.has(n));
            if (missing.length > 0) {
              console.log('DISCOVER: ' + missing.length + ' new building(s) since last run');
              process.exit(1);
            }
            console.log('DISCOVER: sources.json up to date');
          " || node scrape/discover.js

      - name: Scrape listings
        run: node scrape/run.js

      - name: Commit data changes
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "refresh listings ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "no data changes"
          fi
